name: Bug Report
description: Report a bug in snarx CLI, web workbench, or Linux sandbox
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS / Kernel / Node version
      placeholder: "Arch Linux (7.x), Node 22, bwrap 0.13"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
